<!DOCTYPE html>
<html>
  <head>
      <link href="style.css" type="text/css" rel="stylesheet">
  </head>
  <body>
   <table>
     <caption>
       Painting To Do List
     </caption>
     <thead>
       <tr>
         <th></th>
         <th scope="col">Floor color</th>
         <th scope="col">Wall color</th>
         <th scope="col">Ceiling color</th>
       </tr>
     </thead>
     <tbody>
       <tr>
         <th scope="row">Office</th>
         <td>Brown</td>
         <td>Red</td>
         <td>Purple</td>
       </tr>
       <tr>
         <th scope="row">Kitchen</th>
         <td>Black</td>
         <td>Purple</td>
         <td>Yellow</td>
       </tr>
     </tbody>
     <tfoot>
       <tr>
         <th scope="row">Status</th>
         <td>Done</td>
         <td>Done</td>
         <td>Incomplete</td>
       </tr>
     </tfoot>
   </table>
  </body>
</html>
